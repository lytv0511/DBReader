[package]
name = "filebridge"
version = "0.1.0"
edition = "2021"
description = "Android-only file import/export bridge for DBReader"
links = "filebridge"

[lib]
name = "file_bridge"
crate-type = ["lib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = "2"
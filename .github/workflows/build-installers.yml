name: Build Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mobile APK
        env:
          VITE_FORM_FACTOR: mobile
        run: pnpm tauri android build

      - name: Sign mobile APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/dbreader-release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          mkdir -p apk-mobile
          "$BT/zipalign" -f -p 4 "$APK" /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/dbreader-release.keystore --ks-key-alias dbreader \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out apk-mobile/DBReader-mobile.apk /tmp/aligned.apk
          "$BT/apksigner" verify --print-certs apk-mobile/DBReader-mobile.apk
          rm -f /tmp/dbreader-release.keystore /tmp/aligned.apk

      - name: Build tablet APK
        env:
          VITE_FORM_FACTOR: tablet
        run: pnpm tauri android build

      - name: Sign tablet APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/dbreader-release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          mkdir -p apk-tablet
          "$BT/zipalign" -f -p 4 "$APK" /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/dbreader-release.keystore --ks-key-alias dbreader \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out apk-tablet/DBReader-tablet.apk /tmp/aligned.apk
          "$BT/apksigner" verify --print-certs apk-tablet/DBReader-tablet.apk
          rm -f /tmp/dbreader-release.keystore /tmp/aligned.apk

      - name: Upload mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-mobile
          path: apk-mobile
          if-no-files-found: error

      - name: Upload tablet APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-tablet
          path: apk-tablet
          if-no-files-found: error
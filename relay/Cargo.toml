[package]
name = "dbreader-relay"
version = "0.1.0"
edition = "2021"
description = "Sync relay server for DBReader (op relay between devices)"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ureq = { version = "3", default-features = false, features = ["json"] }
tempfile = "3"
